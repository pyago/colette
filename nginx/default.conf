server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web assets are hashed; cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /canvaskit/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for Flutter routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Avoid caching the bootstrap/index so deploys pick up new hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 256;
}
